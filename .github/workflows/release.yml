name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version is read from the `packageManager` field in package.json
        # (pnpm@11.28.2, the first line with npm trusted-publishing support).
        # Don't pass `version:` here to avoid the "Multiple versions of pnpm
        # specified" error.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Pin to Node 22 LTS, matching the repo's `engines.node` floor.
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter "./packages/**" run build

      # Publishing authenticates through npm trusted publishing (OIDC): the job
      # grants `id-token: write`, and pnpm 11 exchanges that GitHub OIDC token
      # for a short-lived npm publish token, so no NPM_TOKEN secret exists to
      # create or rotate. The package must name this repository and workflow as
      # its trusted publisher on npmjs.com for the exchange to succeed.
      - name: Create version PR or publish to npm
        uses: changesets/action@v2
        with:
          # v2 pushes release commits/tags through the GitHub API and does not
          # read the token from the environment or from checkout credentials.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Version PR title/commit, and the publish command run on the merge.
          # `version-script` is left to the action, which invokes the changesets
          # CLI directly; `pnpm run release` forwards the CHANGESETS_OUTPUT
          # ndjson the action needs to create tags and GitHub releases.
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          publish-script: pnpm run release
          create-github-releases: true
