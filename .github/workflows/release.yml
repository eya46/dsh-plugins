name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the `packageManager` field in package.json
        # (pnpm@10.33.0). Don't pass `version:` here to avoid the
        # "Multiple versions of pnpm specified" error.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pin to Node 22 LTS, matching the repo's `engines.node` floor.
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter "./packages/**" run build

      - name: Create version PR or publish to npm
        uses: changesets/action@v1
        with:
          # Open / update the "Version Packages" PR.
          version: pnpm changeset version
          commit: "chore: release packages"
          title: "chore: release packages"
          # What to run on the merge of the version PR (publishes + tags + releases).
          publish: pnpm changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a Granular Access Token with "Automation" type as `NPM_TOKEN`.
          # Trusted publishing (OIDC) is the future; for now a token is simplest.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
